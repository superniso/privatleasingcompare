name: Daglig opdatering
on:
  schedule:
    - cron: "17 4 * * *"   # UTC. 04:17 UTC = 05:17 dansk vintertid / 06:17 sommertid. Undgår hele timer, hvor GitHub har mest travlhed.
  workflow_dispatch:
concurrency:
  group: daglig-opdatering
  cancel-in-progress: false
permissions: {contents: write, pages: write, id-token: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python scraper/run.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Gem data i repository
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add site/data
          if git diff --cached --quiet; then echo "Ingen ændringer"; else git commit -m "Opdater priser" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
