# Tilføj et nyt mærke = tilføj en blok herunder. Ingen kodeændringer nødvendige.
# Er siden for kompleks til selectors, så læg en fil i scraper/custom/<id>.py
# med:  async def scrape(page) -> list[dict]   (se README).
#
# VIGTIGT: url og selectors er pladsholdere. De skal verificeres/udfyldes mod
# de live sider (åbn siden -> højreklik -> Undersøg). Mærker med "TODO" springes over.
defaults: &fields
  model: "TODO"      # CSS-selector for modelnavn inde i et tilbudskort
  variant: ""        # valgfri
  monthly: "TODO"    # pris pr. måned
  down: "TODO"       # udbetaling / førstegangsydelse
  months: ""         # løbetid (tomt = default_months)
  km: ""             # km pr. år (tomt = default_km)
  new_price: ""      # nypris (tomt = slås op i new_prices.yaml)
  link: "a"
default_months: 36
default_km: 15000
brands:
  # vw og tesla bruger egne adaptere i scraper/custom/ (selectors herunder ignoreres)
  - {id: vw,       name: Volkswagen, url: "https://www.volkswagen.dk/app/da/leasingpriser/", card: "TODO", fields: *fields}
  - {id: skoda,    name: Škoda,      url: "https://www.skoda.dk/",                             card: "TODO", fields: *fields}
  - {id: audi,     name: Audi,       url: "https://www.audi.dk/",                              card: "TODO", fields: *fields}
  - {id: hyundai,  name: Hyundai,    url: "https://www.hyundai.com/dk/",                       card: "TODO", fields: *fields}
  - {id: kia,      name: Kia,        url: "https://www.kia.com/dk/",                           card: "TODO", fields: *fields}
  - {id: tesla,    name: Tesla,      url: "https://www.tesla.com/da_dk/modely/design",                       card: "TODO", fields: *fields}
  - {id: zeekr,    name: Zeekr,      url: "https://www.zeekr.dk/",                             card: "TODO", fields: *fields}
  - {id: bmw,      name: BMW,        url: "https://www.bmw.dk/",                               card: "TODO", fields: *fields}
  - {id: mercedes, name: Mercedes,   url: "https://www.mercedes-benz.dk/",                     card: "TODO", fields: *fields}
  - {id: ford,     name: Ford,       url: "https://www.ford.dk/",                              card: "TODO", fields: *fields}
  - {id: volvo,    name: Volvo,      url: "https://www.volvocars.com/dk/",                     card: "TODO", fields: *fields}
