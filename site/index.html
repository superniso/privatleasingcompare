<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privatleasing – prisoverblik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f6f3;--surface:#fff;--ink:#16201b;--mute:#5d6a63;--line:#d9dfda;--good:#0b6b4d;--good-bg:#e1f3ea;--bad:#a43a1f;--font:"Schibsted Grotesk",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111815;--surface:#18211d;--ink:#e8efea;--mute:#9aa8a0;--line:#2a3730;--good:#5fd3a2;--good-bg:#12362a;--bad:#f09070;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);font-variant-numeric:tabular-nums}
nav{margin-bottom:12px;color:var(--mute)}nav a{color:var(--ink)}
main{max-width:min(1700px,100%);margin:0 auto;padding:32px 20px 64px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);max-width:62ch;margin:0 0 24px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
select,input[type=search]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
label.chk{display:flex;gap:6px;align-items:center}
.stat{margin-left:auto;color:var(--mute)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td:nth-child(2){white-space:normal;min-width:11em}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-weight:700;color:var(--mute);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th[aria-sort]::after{content:attr(data-arrow);margin-left:4px}
th[data-arrow$="₂"]{opacity:.65}
tr:last-child td{border-bottom:0}
tr.good td{background:var(--good-bg)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-weight:700;font-size:13px;background:var(--line)}
.good .pill{background:var(--good);color:var(--surface)}
.up{color:var(--bad)}.down{color:var(--good)}
td a{color:inherit;font-weight:700;text-underline-offset:3px}
a:focus-visible,th:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.status{margin-top:20px;color:var(--mute);font-size:13px}
.status b{color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;color:var(--mute);background:none;border:0;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--good);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.tiles[hidden]{display:none}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px #0002;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0003}
.card.good{border-color:var(--good);box-shadow:0 0 0 2px var(--good)}
.card header{padding:14px 16px 16px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 55% 24%),hsl(var(--h) 60% 38%))}
.card .brand{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.card .rib{float:right;font-size:11px;font-weight:800;background:#ffd45c;color:#3a2a00;border-radius:99px;padding:2px 9px}
.card h3{margin:6px 0 0;font-size:21px;line-height:1.15;font-weight:800}
.card header p{margin:2px 0 0;font-size:13px;opacity:.9}
.price{padding:14px 16px 6px;display:flex;align-items:baseline;gap:6px}
.price b{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.price span{color:var(--mute);font-size:13px}
.card dl{margin:0;padding:6px 16px}
.card dl div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.card dl div:last-child{border:0}
.card dt{color:var(--mute)}.card dd{margin:0;font-weight:700}
.meter{padding:6px 16px 12px}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.bar2{position:relative;height:8px;border-radius:99px;background:var(--line)}
.bar2 i{display:block;height:100%;border-radius:99px;background:var(--mute)}
.card.good .bar2 i{background:var(--good)}
.bar2 u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.card footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.btn{font-weight:700;font-size:13px;color:var(--bg);background:var(--ink);padding:7px 12px;border-radius:8px;text-decoration:none}
.btn:hover{opacity:.85}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
</style>
</head>
<body>
<main>
<nav><b>Aktuelle tilbud</b> · <a href="historik.html">Prishistorik</a></nav>
<h1>Privatleasing i Danmark</h1>
<p class="sub">Samlet tilbagebetaling = udbetaling + månedlig ydelse × løbetid. Et tilbud er godt, når det er under 50 % af bilens nypris.</p>
<div class="bar">
  <select id="brand" aria-label="Mærke"><option value="">Alle mærker</option></select>
  <select id="km" aria-label="Km pr. år"><option value="">Alle km pr. år</option></select>
  <select id="down" aria-label="Førstegangsydelse"><option value="">Alle førstegangsydelser</option></select>
  <input id="q" type="search" placeholder="Søg model" aria-label="Søg model">
  <select id="sort" aria-label="Sortér efter">
    <option value="model,down,km">Sortér: Model, udbetaling, km pr. år</option>
    <option value="model,monthly">Sortér: Model, derefter pris pr. md.</option>
    <option value="monthly,model">Sortér: Pris pr. md. (lavest først)</option>
    <option value="total,model">Sortér: Samlet tilbagebetaling (lavest først)</option>
    <option value="ratio,model">Sortér: Andel af nypris (lavest først)</option>
    <option value="down,monthly">Sortér: Førstegangsydelse (lavest først)</option>
    <option value="km,monthly">Sortér: Km pr. år (lavest først)</option>
  </select>
  <label class="chk"><input id="onlyGood" type="checkbox"> Kun gode tilbud</label>
  <div class="seg" role="group" aria-label="Visning"><button type="button" data-v="tiles">Tiles</button><button type="button" data-v="list">Liste</button></div>
  <span class="stat" id="stat"></span>
</div>
<div class="tiles" id="tiles" hidden></div>
<div class="wrap" id="lst" hidden><table>
<thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<p class="status" id="status"></p>
</main>
<script>
const TIP_R="Samlet tilbagebetaling ÷ bilens nypris. Samlet tilbagebetaling = udbetaling (førstegangsydelse) + månedlig ydelse × løbetid + evt. afleveringsgebyr. Under 50 % regnes som et godt tilbud.\n\nAftaler under 36 mdr. (fx 12 mdr.): En kort aftale ser kunstigt billig ud, fordi du kun betaler for få måneder. Derfor omregnes den. Vi antager samme udbetaling og månedlige ydelse, beregner andelen for både 36 og 48 mdr. og bruger gennemsnittet. Tal med * er omregnet. Korte aftaler har ofte en højere ydelse pr. måned, så det er et forsigtigt (højt) estimat.",TIP_C="Dato for seneste prisændring. Er prisen ikke ændret siden første registrering, vises den dato, tilbuddet først blev set.";
const dato=d=>d?new Date(d).toLocaleDateString("da-DK",{day:"numeric",month:"short",year:"numeric"}):"–";
const esc=t=>t.replace(/"/g,"&quot;");
const COLS=[["brand","Mærke"],["model","Model"],["monthly","Pr. mdr. fra"],["down","Udbetaling"],["months","Løbetid mdr."],["km","Km/år"],["total","Samlet"],["new_price","Nypris"],["ratio","Andel af nypris",TIP_R],["last_changed","Sidst ændret",TIP_C]];
const kr=n=>n==null?"–":n.toLocaleString("da-DK")+" kr.";
let all=[],stack=[{k:"model",dir:1},{k:"down",dir:1},{k:"km",dir:1}];
const $=id=>document.getElementById(id);
const KEY={model:o=>o.model+" "+o.variant};
const val=(o,k)=>(KEY[k]||(x=>x[k]))(o);
function cmp(a,b){for(const s of stack){const x=val(a,s.k),y=val(b,s.k);if(x==null&&y==null)continue;if(x==null)return 1;if(y==null)return-1;
  const c=typeof x==="string"?x.localeCompare(y,"da",{numeric:true}):x-y;if(c)return c*s.dir}return 0}
function head(){$("head").innerHTML=COLS.map(([k,l,t])=>{const i=stack.findIndex(s=>s.k===k);
  const arrow=i<0?"":` data-arrow="${stack[i].dir>0?"↑":"↓"}${i?"₂":""}"`;
  return `<th tabindex="0" data-k="${k}" ${t?`title="${esc(t)}"`:""} ${i<0?"":`aria-sort="${stack[i].dir>0?"ascending":"descending"}"`}${arrow}>${l}</th>`}).join("")}
function fill(id,vals,fmt){$(id).insertAdjacentHTML("beforeend",[...new Set(vals)].sort((a,b)=>a-b).map(v=>`<option value="${v}">${fmt(v)}</option>`).join(""))}
const pct=x=>(x*100).toFixed(1).replace(".",",")+" %";
function pill(o){if(o.ratio==null)return `<span class="pill">mangler nypris</span>`;
  if(o.ratio_basis!=="omregnet")return `<span class="pill">${pct(o.ratio)}</span>`;
  const t=o.ratio_terms||{};
  return `<span class="pill" title="${esc(`Omregnet fra ${o.months} mdr.: andel ved 36 mdr. = ${pct(t["36"])}, ved 48 mdr. = ${pct(t["48"])}. Gennemsnit = ${pct(o.ratio)}. Uden omregning ville den samlede tilbagebetaling over ${o.months} mdr. udgøre ${pct(o.total/o.new_price)} af nyprisen.`)}">${pct(o.ratio)}*</span>`}
let view=(()=>{try{return localStorage.getItem("view")}catch(e){return null}})()||"tiles";
const hue=o=>[...o.brand_id].reduce((a,c)=>(a+c.charCodeAt(0)*37)%360,0);
const chg=o=>{const d=o.prev_monthly!=null?o.monthly-o.prev_monthly:0;return d?`<small class="${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d).toLocaleString("da-DK")}</small>`:""};
function tile(o){const w=o.ratio==null?0:Math.min(o.ratio,1)*100;
  return `<article class="card${o.good?" good":""}" style="--h:${hue(o)}">
  <header><span class="brand">${o.brand}</span>${o.good?`<span class="rib">★ Top tilbud</span>`:""}<h3>${o.model}</h3><p>${o.variant||"&nbsp;"}</p></header>
  <div class="price"><b>${o.monthly.toLocaleString("da-DK")}</b><span>kr./md.</span>${chg(o)}</div>
  <dl><div><dt>Udbetaling</dt><dd>${kr(o.down)}</dd></div><div><dt>Km pr. år</dt><dd>${o.km.toLocaleString("da-DK")}</dd></div><div><dt>Løbetid</dt><dd>${o.months} mdr.</dd></div><div><dt>Samlet</dt><dd>${kr(o.total)}</dd></div><div><dt>Nypris</dt><dd>${kr(o.new_price)}</dd></div></dl>
  <div class="meter"><div class="mh"><span title="${esc(TIP_R)}">Andel af nypris</span>${pill(o)}</div><div class="bar2"><i style="width:${w}%"></i><u></u></div></div>
  <footer><span>Ændret ${dato(o.last_changed||o.first_seen)}</span><a class="btn" href="${o.link}" target="_blank" rel="noopener">Se tilbud ↗</a></footer></article>`}
function render(){
  const b=$("brand").value,q=$("q").value.toLowerCase(),g=$("onlyGood").checked,km=$("km").value,dn=$("down").value;
  const r=all.filter(o=>(!b||o.brand_id===b)&&(!g||o.good)&&(!km||o.km==km)&&(dn===""||o.down==dn)&&(o.model+" "+o.variant).toLowerCase().includes(q)).sort(cmp);
  head();
  $("stat").textContent=`${r.length} tilbud · ${r.filter(o=>o.good).length} gode`;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===view));
  const t=view==="tiles";$("tiles").hidden=!t;$("lst").hidden=t;
  if(t){$("tiles").innerHTML=r.length?r.map(tile).join(""):`<p class="empty">Ingen tilbud matcher dine filtre.</p>`;return}
  $("body").innerHTML=r.length?r.map(o=>{
    const d=o.prev_monthly!=null?o.monthly-o.prev_monthly:0;
    const ch=d?` <small class="${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d).toLocaleString("da-DK")}</small>`:"";
    return `<tr class="${o.good?"good":""}"><td>${o.brand}</td><td><a href="${o.link}" target="_blank" rel="noopener" title="Åbn privatleasing-siden hos forhandleren">${o.model} ↗</a> ${o.variant||""}</td>
    <td>${kr(o.monthly)}${ch}</td><td>${kr(o.down)}</td><td>${o.months}</td><td>${o.km.toLocaleString("da-DK")}</td>
    <td>${kr(o.total)}</td><td>${kr(o.new_price)}</td><td>${pill(o)}</td><td>${dato(o.last_changed||o.first_seen)}</td></tr>`}).join("")
  :`<tr><td colspan="10" class="empty">Ingen tilbud matcher dine filtre.</td></tr>`;
}
document.querySelector(".seg").addEventListener("click",e=>{const v=e.target.dataset.v;if(!v)return;view=v;try{localStorage.setItem("view",v)}catch(err){}render()});
$("head").addEventListener("click",e=>{const k=e.target.dataset.k;if(!k)return;
  stack=stack[0].k===k?[{k,dir:-stack[0].dir},...stack.slice(1)]:[{k,dir:1},...stack.filter(s=>s.k!==k)].slice(0,3);render()});
$("head").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.click()});
["brand","q","onlyGood","km","down"].forEach(i=>$(i).addEventListener("input",render));
$("sort").addEventListener("input",e=>{stack=e.target.value.split(",").map(k=>({k,dir:1}));render()});
fetch("data/offers.json").then(r=>r.json()).then(d=>{
  all=d.offers;
  fill("km",all.map(o=>o.km),v=>v.toLocaleString("da-DK")+" km");
  fill("down",all.map(o=>o.down),v=>kr(v));
  const ids=[...new Map(all.map(o=>[o.brand_id,o.brand]))];
  $("brand").insertAdjacentHTML("beforeend",ids.map(([i,n])=>`<option value="${i}">${n}</option>`).join(""));
  const bad=Object.entries(d.status).filter(([,s])=>!s.ok).map(([k])=>k);
  $("status").innerHTML=(d.updated?`Opdateret ${new Date(d.updated).toLocaleString("da-DK")}. `:"Ikke opdateret endnu. ")+(bad.length?`<b>Kunne ikke hentes:</b> ${bad.join(", ")}`:"");
  render();
}).catch(()=>{$("status").textContent="Kunne ikke indlæse data/offers.json (åbn siden via en webserver, ikke som fil).";render()});
</script>
</body>
</html>
